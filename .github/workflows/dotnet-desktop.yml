name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Restore solution
      run: dotnet restore GeroImperium.slnx

    - name: Build solution
      run: dotnet build GeroImperium.slnx --configuration ${{ matrix.configuration }} --no-restore

    - name: Run tests
      run: dotnet test GeroImperium.slnx --configuration ${{ matrix.configuration }} --no-build
